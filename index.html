if(s===6)return title('lostTitle','lostDesc')+`<div class="panel warning"><div class="pill warn">${t('staleBadge')}</div><p>${t('stale')}</p></div>`+map('stale')+`<div class="panel"><div class="detail-row">${ic('ambulance')}<div><strong>${t('unit')}</strong><p>${t('crew')}</p></div></div></div>`+`<button class="secondary" data-action="refresh">${t('refresh')}</button>`+callButton()+`<p class="notice center">${t('reportNote')}</p>`+progress(0);
if(s===7)return `<div style="height:22px"></div><div class="illustration">${ic('lock')}</div>`+title('restrictedTitle','restrictedDesc')+`<div class="panel soft restriction"><div class="detail-row">${ic('shield')}<div><strong>${t('privacyTitle')}</strong><p>${t('privacyDesc')}</p></div></div></div><div class="center" style="margin:26px 0"><span class="pill gray">${t('expired')}</span></div><div style="height:96px"></div><button class="secondary" data-action="help">${t('help')}</button>`;
if(s===8)return title('awaitTitle','awaitDesc')+`<div class="illustration">${ic('clock')}</div><div class="panel warning"><div class="pill warn">${t('awaitStatus')}</div><p>${t('awaitInfo')}</p></div><div class="panel soft"><strong>${t('noeta')}</strong><p>${t('awaitWhy')}</p></div>`+details()+callButton()+`<button class="text-button" data-action="report">${t('changed')}</button><p class="notice center">${t('reportNote')}</p>`;
return title('closedTitle','closedDesc')+`<div class="illustration">${ic('shield')}</div><div class="panel good"><strong>${t('closedStatus')}</strong><p>${t('noTransport')}</p></div><div class="panel"><h3>${t('nextSteps')}</h3><p>${t('nextStepsText')}</p><div class="panel soft" style="margin-bottom:0"><strong>${t('noInstructions')}</strong><p>${t('noInstructionsText')}</p></div></div><div class="panel soft"><strong>${t('trackingEnded')}</strong><p>${t('trackingDesc')}</p></div><button class="secondary" data-action="feedback">${t('feedback')}</button>`;
}
function phoneFor(s){return `<div class="demo-strip">${t('demo')}</div><header class="appbar"><div class="brand"><div class="brandmark">${ic('ambulance')}</div><div><div class="eyebrow">${t('brand')}</div><small>${t('place')}</small></div></div><button class="lang" data-action="lang" aria-label="Switch language">${t('lang')}</button></header><main class="main"><div class="greet"><span class="ref">${t('ref')}</span><span class="pill ${s===7?'gray':s===6?'warn':''}">${t(s===4||s===5?'family':s===7?'bystander':'private')}</span></div>${bodyFor(s)}</main><footer class="foot"><span class="secure">${ic('lock')}${t('secure')}</span><button data-action="help">${t('help')}</button></footer>`}
function render(){const phone=document.getElementById('phone');phone.innerHTML=phoneFor(stage);phone.dir=language==='ar'?'rtl':'ltr';phone.lang=language;phone.classList.toggle('arabic',language==='ar');document.getElementById('stage-nav').innerHTML=`<div class="eyebrow">Explore the journey</div>${stageMeta.map((s,i)=>`<button class="stage-btn ${i===stage?'active':''}" data-stage="${i}" aria-pressed="${i===stage}"><span class="stage-num">${i+1}</span><span><strong>${s[0]}</strong><small>${s[1]}</small></span></button>`).join('')}<p class="nav-note">All interactions run locally.<br>No messages, calls or alerts are sent.<br>No camera or location permissions are requested.</p>`;renderNotes()}
function renderNotes(){const m=stageMeta[stage];document.getElementById('notes').innerHTML=`<div class="eyebrow">Design review · outside patient view</div><div class="note-card"><div class="note-number">${String(stage+1).padStart(2,'0')} / EXPERIENCE</div><h3>${m[1]}</h3><p>${m[2]}</p></div><div class="note-card"><div class="note-number">WORKFLOW</div><h3>How this would operate</h3><p>${m[3]}</p></div><div class="note-card"><div class="note-number">IMPORTANT DISTINCTION</div><h3>What the screen must not imply</h3><p>${m[4]}</p></div>${stage===4?`<button class="subtle-button" data-action="toggle-ack" style="width:100%;font-size:11px">Show ${acknowledged?'pending':'acknowledged'} hospital notification</button>`:''}<div class="note-bottom"><strong>Prototype review notes</strong><br>All data, events and geographical layouts are synthetic. The Arabic content requires professional clinical translation and local usability review. Exact service branding, authorisation rules and workflow ownership remain design decisions.</div>`}
function notify(msg){const toast=document.getElementById('toast');toast.textContent=msg;toast.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.add('hidden'),6500)}
function openModal(kind){const bg=document.getElementById('modal-bg'),modal=document.getElementById('modal');bg.classList.remove('hidden');modal.dir=language==='ar'?'rtl':'ltr';let content='';
if(kind==='share'){content=`<h2 id="modal-title">${t('familyTitle')}</h2><p>${t('familyDesc')}</p><div class="panel soft"><div class="label">${t('recipient')}</div><strong dir="ltr">+966 •• ••• 0421</strong><p>${t('permission')}</p></div>${familyActive?`<div class="panel good" role="status"><strong>${t('created')}</strong><p dir="ltr" style="overflow-wrap:anywhere">demo.local/family/synthetic-token-0421</p><p>${t('scope')}</p></div><button class="secondary danger-button" data-action="revoke">${t('revoke')}</button>`:`<button class="primary" data-action="create">${t('create')}</button>`}<p style="font-size:10px;margin-bottom:0">DEMO · No real token, link or message is created.</p>`}
else if(kind==='report'){content=`<h2 id="modal-title">${t('reportTitle')}</h2><p>${t('reportDesc')}</p><label class="form-label" for="report-kind">${t('changed')}</label><select class="input" id="report-kind"><option>${t('reportOption1')}</option><option>${t('reportOption2')}</option><option>${t('reportOption3')}</option></select><button class="primary" style="margin-top:14px" data-action="submit-report">${t('submit')}</button>`+callButton()}
else{content=`<h2 id="modal-title">${t(kind==='feedback'?'feedback':'help')}</h2><p>${t(kind==='feedback'?'feedbackOptions':'helptext')}</p><button class="primary" data-action="close">${t('close')}</button>`}
modal.innerHTML=`<button class="modal-close" data-action="close" aria-label="${t('close')}">×</button>${content}`;setTimeout(()=>modal.querySelector('button').focus(),0)}
function closeModal(){document.getElementById('modal-bg').classList.add('hidden');document.querySelector('#phone .lang').focus()}
document.addEventListener('click',e=>{const stageBtn=e.target.closest('[data-stage]');if(stageBtn){stage=Number(stageBtn.dataset.stage);render();return}const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;
if(a==='lang'){language=language==='en'?'ar':'en';render()}
else if(a==='entrance'){stage=1;render()}
else if(a==='save-entrance'){entranceDraft[language]=document.getElementById('entrance-input').value;entrancePending=true;render();notify(t('demoPrefix')+t('noalert'))}
else if(a==='call')notify(t('demoPrefix')+t('notcall'));
else if(a==='callback')notify(t('demoPrefix')+t('notrequest'));
else if(a==='refresh')notify(t('demoPrefix')+t('notrefresh'));
else if(a==='share'||a==='report'||a==='help'||a==='feedback')openModal(a);
else if(a==='close')closeModal();
else if(a==='create'){familyActive=true;openModal('share');notify(t('familyMade'))}
else if(a==='revoke'){familyActive=false;openModal('share');notify(t('familyRevoked'))}
else if(a==='submit-report'){closeModal();notify(t('thanks'))}
else if(a==='toggle-ack'){acknowledged=!acknowledged;render()}
});
document.getElementById('modal-bg').addEventListener('click',e=>{if(e.target.id==='modal-bg')closeModal()});document.addEventListener('keydown',e=>{const bg=document.getElementById('modal-bg');if(bg.classList.contains('hidden'))return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const f=Array.from(document.getElementById('modal').querySelectorAll('button,input,select'));const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}}});
function buildStoryboard(){document.getElementById('storyboard').innerHTML=stageMeta.map((s,i)=>`<section class="story-page"><div class="phone ${language==='ar'?'arabic':''}" dir="${language==='ar'?'rtl':'ltr'}">${phoneFor(i)}</div><aside class="story-note"><div class="eyebrow">North Riyadh · Concept ${i+1}/${stageMeta.length}</div><h2>${s[0]}</h2><p><strong>${s[1]}</strong></p><p>${s[2]}</p><p>${s[3]}</p><p>${s[4]}</p><p>Illustrative prototype. Synthetic data. No live service. Arabic translation requires review.</p></aside></section>`).join('')}
document.getElementById('print-button').addEventListener('click',()=>{buildStoryboard();window.print()});window.addEventListener('beforeprint',buildStoryboard);
window.demo={setStage:(n)=>{stage=n;render()},getState:()=>({stage,language,entrancePending,familyActive,acknowledged}),setLanguage:(v)=>{language=v;render()},buildStoryboard};
render();
</script>
</body>
</html>
